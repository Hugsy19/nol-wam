<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>NOL Scout · 全屏座位图 视觉回归</title>
<style>
  html,body{margin:0;height:100%;background:#141a22;color:#c9d4e2;
    font:13px/1.6 -apple-system,"PingFang SC",sans-serif}
  /* 伪造一个"已经在页面中间"的选座页：用来暴露"宿主元素没定位"的 bug —— 
     如果浮层是普通块级元素，它会掉到这段内容下面，截图里就什么都看不到 */
  .filler{padding:24px;max-width:900px}
  .filler h1{font-size:18px;margin:0 0 8px}
  .filler p{color:#7b8ba1;margin:0 0 14px}
  .mockmap{position:relative;width:527px;height:700px;background:#0b1017;border:1px solid #253044;border-radius:8px}
  .mockmap img{position:absolute;inset:0;width:527px;height:700px}
  .mockmap svg.seat{position:absolute;inset:0;width:527px;height:700px}
  #diag{position:fixed;left:8px;bottom:8px;z-index:2147483647;background:#000c;color:#9fe8b5;
    font:11px/1.5 ui-monospace,Menlo,monospace;padding:6px 9px;border-radius:6px;max-width:900px;white-space:pre-wrap}
</style>
</head>
<body>
  <div class="filler">
    <h1>伪造的 NOL 选座页（占位内容）</h1>
    <p>下面这段占位内容的作用是：如果插件浮层没有真正"贴到视口上"，它就会掉到这里之后，截图上就什么都看不到。</p>
    <div class="mockmap" id="mockmap">
      <img class="mockbase" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='527' height='700'><rect width='527' height='700' fill='%230b1017'/><text x='20' y='40' fill='%232b3a52' font-size='20'>VENUE BASE MAP</text></svg>" />
    </div>
  </div>

  <script>
  // 先把页面上的所有错误都记录下来，避免"插件脚本悄悄挂了"却毫无线索
  window.__errs = [];
  window.addEventListener('error', (e) => window.__errs.push('error: ' + (e.message || e.type) + ' @' + (e.filename || '') + ':' + (e.lineno || '')));
  window.addEventListener('unhandledrejection', (e) => window.__errs.push('rejection: ' + (e.reason && e.reason.message || e.reason)));
  </script>

  <script src="./fixture.js"></script>
  <script>
  // ---------- 用真实抓包喂出一个可用的座位目录 ----------
  const F = window.__NOL_FIXTURE__;
  const MODE = new URLSearchParams(location.search).get('mode') || 'new';

  const nowMs = Date.now();
  const rsp = (obj, isText) => ({
    ok: true, status: 200, statusText: 'OK',
    headers: { get: (k) => (String(k).toLowerCase() === 'date' ? new Date().toUTCString() : null) },
    json: async () => obj,
    text: async () => (isText ? String(obj) : JSON.stringify(obj)),
    clone() { return this; },
  });

  window.fetch = async (input) => {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (/getServerTime/.test(url)) return rsp(nowMs + (Date.now() - nowMs), true);
    if (/seats\/block-data/.test(url)) return rsp(F.blockData);
    if (/\/seatMeta/.test(url)) {
      const keys = [...new URL(url).searchParams.getAll('blockKeys')];
      return rsp({ data: keys.map((k) => F.seatMeta[k]).filter(Boolean) });
    }
    if (/\/seatStatus/.test(url)) {
      const keys = [...new URL(url).searchParams.getAll('blockKeys')];
      return rsp({ data: keys.map((k) => F.seatStatus[k] ?? '') });
    }
    if (/seats\/grades/.test(url)) return rsp(F.grades);
    if (/\/onestop\/gql/.test(url)) {
      const body = String((input && input.init && input.init.body) || '');
      if (/ExpiredSession/.test(body)) return rsp({ data: { isExpiredSession: false } });
      if (/GetSeatGradePrices/.test(body)) return rsp({ data: { getSeatGradePrices: F.gqlPrices || [] } });
      return rsp({ data: {} });
    }
    return rsp({});
  };

  // ---------- 最小可用的扩展 API 桩 ----------
  const listeners = [];
  window.chrome = {
    runtime: {
      onMessage: { addListener: (fn) => listeners.push(fn) },
      sendMessage: async () => ({ ok: true }),
      getURL: (p) => p,
      lastError: null,
    },
    storage: {
      // 真的记一下：v0.6.1 的面板位置记忆要靠 set → get 闭环来验证
      local: (() => {
        const mem = {};
        // 需要验证"验证码期自动开扫"这条开关时，先把它种进去
        if (MODE === 'captchagate') mem.scoutPrefs = { captchaAutoStart: true };
        return {
          _mem: mem,
          get: async (keys) => {
            if (keys == null) return { ...mem };
            const out = {};
            for (const k of [].concat(keys)) if (k in mem) out[k] = mem[k];
            return out;
          },
          set: async (obj) => { Object.assign(mem, obj || {}); },
          remove: async (keys) => { for (const k of [].concat(keys)) delete mem[k]; },
        };
      })(),
      onChanged: { addListener: () => {} },
      session: { set: async () => ({}) },
    },
  };
  </script>

  <script src="../../content/seat-bundle.js"></script>

  <script>
  // ---------- 喂会话 + 等目录构建 + 点开全屏图 ----------
  const diag = document.createElement('div');
  diag.id = 'diag';
  document.body.appendChild(diag);

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  // file:// 页面的 location.origin 是字符串 "null"，用它当 targetOrigin 在部分 Chrome 版本里会被丢弃，
  // 所以这里用 '*'（插件的监听器只认 __tag 与 ev.source，不校验 origin）
  const feed = (msg) => window.postMessage(msg, '*');

  (async () => {
    if (MODE === 'old') return reproduceOldBug();
    // 抓包里的令牌尾数是 10 位 Unix 秒（= 排队放行那一刻），但那是过去的时间，
    // 直接用会让倒计时立刻"已到"。换成"现在"就能看到真实的 10 分钟倒计时 + 验证码徽标。
    const LIVE_SESSION = (MODE === 'captcha' || MODE === 'captchagate' || MODE === 'captchahold')
      ? F.session.slice(0, -10) + String(Math.floor(Date.now() / 1000))
      : F.session;
    feed({
      __tag: 'nol-scout-hook', type: 'session',
      payload: { session: LIVE_SESSION, channel: 'TRIPLE_KOREA', lang: 'EN', href: location.href },
    });
    // 顺带把页面自己拉的余票也"旁听"进来（真实环境里由 MAIN world 钩子转发）
    for (const [k, v] of Object.entries(F.seatStatus)) {
      feed({
        __tag: 'nol-scout-hook', type: 'api',
        payload: {
          url: `https://tickets.interpark.com/onestop/api/seatStatus?goodsCode=${F.goodsCode}&placeCode=${F.placeCode}&playSeq=${F.playSeq}&blockKeys=${encodeURIComponent(k)}`,
          status: 200, text: JSON.stringify({ data: [v] }),
        },
      }, location.origin);
    }

    const host = document.getElementById('nol-scout-host');
    if (!host) {
      diag.textContent = `✗ 面板宿主 #nol-scout-host 未创建\n脚本错误 = ${window.__errs.length ? window.__errs.join('\n') : '无'}`;
      return;
    }
    const root = host.shadowRoot;
    // 等座位目录真的建出来（有 #mapBox 里的 svg 才算），最多等 20s 虚拟时间
    let panelSvg = null;
    for (let i = 0; i < 400; i++) {
      panelSvg = root.querySelector('#mapBox svg');
      if (panelSvg) break;
      await wait(100);
    }
    await wait(400);   // 让首帧渲染落定
    const panelLogs = [...root.querySelectorAll('.logs div')].map((d) => d.textContent.trim()).slice(0, 12);

    // ---------- 面板落点：v0.6.1 要求默认贴左，别挡住中间的选座区域 ----------
    const pr = host.getBoundingClientRect();
    const panelRect = [pr.x, pr.y, pr.width, pr.height].map(Math.round);
    const sideOk = pr.x + pr.width / 2 < innerWidth / 2;

    // mode=panel：只看"面板默认落在哪儿"（不点全屏图、不拖动），方便截图比对
    if (MODE === 'panel') {
      diag.textContent = [
        `mode            = ${MODE}`,
        `viewport        = ${innerWidth}×${innerHeight}`,
        `面板矩形         = ${panelRect.join(', ')}`,
        `面板默认落点     = ${sideOk ? '✓ 贴左（未遮挡中间选座区）' : '✗ 仍在右侧'}`,
      ].join('\n');
      return;
    }

    // ---------- mode=captcha / captchagate / captchahold：注入同款 class 的验证码模态 ----------
    // hold = 不喂 verify 响应，让徽标一直挂着 —— 专门用来截图看视觉效果
    if (MODE === 'captcha' || MODE === 'captchagate' || MODE === 'captchahold') {
      const HOLD = MODE === 'captchahold';
      const modal = document.createElement('div');
      modal.id = 'fake-captcha';
      modal.style.cssText = 'position:fixed;left:56%;top:180px;z-index:2147482000;background:#12161d;'
        + 'border:1px solid #2a3346;border-radius:8px;padding:14px';
      // class 前缀取自真实抓包：ModalCaptchaText_captchaBox / _captchaImage / _captchaInput
      modal.innerHTML = `
        <div class="ModalCaptchaText_captchaBox__B_pUV">
          <img class="ModalCaptchaText_captchaImage__Mitgq" width="150" height="60" alt=""
               src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='60'><rect width='150' height='60' fill='%23dfe6f0'/><text x='14' y='40' font-size='26' font-family='monospace'>XUTBKZ</text></svg>" />
          <input class="ModalCaptchaText_captchaInput__DC7Gz" maxlength="6" />
        </div>`;
      document.body.appendChild(modal);
      await wait(1400);   // 观察器去抖 250ms + 聚焦重试 700ms

      const badge = document.getElementById('nol-scout-captcha');
      const br = badge ? badge.getBoundingClientRect() : null;
      const box = modal.querySelector('[class*="captchaBox"]').getBoundingClientRect();
      const input = modal.querySelector('[class*="captchaInput"]');
      const focused = document.activeElement === input;
      const inputVal = input.value;

      // 面板横幅
      const capBanner = root.getElementById('capBanner');
      const capTxt = capBanner ? capBanner.textContent.replace(/\s+/g, ' ').trim() : '';
      const capTone = capBanner ? capBanner.className : '';

      // 模拟服务端返回 {"result":"Y"}（真实抓包里就是这条）；hold 模式故意不喂，让徽标一直挂着
      if (!HOLD) {
        window.postMessage({
          __tag: 'nol-scout-hook', type: 'api',
          payload: {
            url: 'https://tickets.interpark.com/onestop/api/captcha/verify?p1=XUTBKZ&p2='
              + F.session + '&p3=' + F.goodsCode + '&p9=J66lJX',
            status: 200, text: '{"result":"Y"}',
          },
        }, '*');
      }
      await wait(HOLD ? 2600 : 400);
      const logsAfter = [...root.querySelectorAll('.logs div')].map((d) => d.textContent.trim());
      const passLine = logsAfter.find((l) => l.includes('验证码通过')) || (HOLD ? '（hold 模式：故意不喂，徽标应一直挂着）' : '(没找到通关日志)');
      const answerLeak = logsAfter.some((l) => l.includes('XUTBKZ'));

      await wait(1600);
      const badgeGone = HOLD ? document.getElementById('nol-scout-captcha') : !document.getElementById('nol-scout-captcha');

      diag.textContent = [
        `mode            = ${MODE}`,
        `脚本错误         = ${window.__errs.length ? window.__errs.join(' | ') : '无'}`,
        `检测到关卡       = ${badge ? '✓ 徽标已挂载' : '✗ 没反应'}`,
        `徽标位置         = ${br ? [br.x, br.y, br.width, br.height].map(Math.round).join(', ') : '—'}`,
        `是否贴着验证码框 = ${br && br.bottom <= box.top + 2 && Math.abs(br.left - box.left) < 140 ? '✓ 贴在框上方' : '（回退到屏幕顶部/其他位置）'}`,
        `输入框已聚焦     = ${focused ? '✓ 是（省掉一次点击）' : '✗ 否'}`,
        `输入框当前内容   = ${JSON.stringify(inputVal)}${inputVal === '' ? '  ✓ 未代填' : '  ✗ 被写入了！'}`,
        `面板横幅         = ${capTxt || '—'}`,
        `横幅色调         = ${capTone}`,
        `通关日志         = ${passLine}`,
        `答案是否泄漏     = ${answerLeak ? '✗ 日志里出现了答案！' : '✓ 未出现（p1 已抹）'}`,
        `徽标状态         = ${HOLD ? (badgeGone ? '✓ 一直挂着（hold）' : '✗ 被收走了') : (badgeGone ? '✓ 通过后自动收起' : '✗ 还在')}`,
        `扫描状态         = ${(root.querySelector('#btnScan')?.textContent || '').includes('停止') ? '✓ 已在扫描（未空转）' : '仍等用户点开始'}`,
        `开关             = ${JSON.stringify(window.chrome.storage.local._mem.scoutPrefs || null)}`,
        `尾部日志         = ${logsAfter.slice(0, 6).join(' ／ ')}`,
      ].join('\n');
      return;
    }

    // 拖到右下角 → 松手 → 位置必须被夹进视口并落盘（刷新后才回得到原位）
    const hd = root.querySelector('.hd');
    const beforeDrag = [pr.x, pr.y].map(Math.round);
    hd.dispatchEvent(new MouseEvent('mousedown', { clientX: pr.x + 120, clientY: pr.y + 14, bubbles: true }));
    window.dispatchEvent(new MouseEvent('mousemove', { clientX: pr.x + 120 + 2000, clientY: pr.y + 14 + 2000, bubbles: true }));
    window.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    await wait(250);
    const dr = host.getBoundingClientRect();
    const stored = window.chrome.storage.local._mem.panelPos;
    const dragMemo = stored
      ? `left=${stored.left} top=${stored.top}`
      : '（未落盘）';
    const dragInView = dr.right <= innerWidth + 1 && dr.left >= -1 && dr.top >= -1
      && dr.top < innerHeight - 100;

    // 贴左 / 贴右切换按钮：拖完停在右侧，点一下应该翻回左边
    const wasRight = dr.x + dr.width / 2 > innerWidth / 2;
    root.querySelector('[data-act="flip"]')?.click();
    await wait(250);
    const fr = host.getBoundingClientRect();
    const nowRight = fr.x + fr.width / 2 > innerWidth / 2;
    const flipStored = window.chrome.storage.local._mem.panelPos;
    const flipOk = wasRight !== nowRight;

    const panelDots = panelSvg ? panelSvg.querySelectorAll('circle').length : 0;

    const btn = root.querySelector('[data-act="fullmap"]');
    if (!btn) {
      diag.textContent = `✗ 面板里没有 [data-act="fullmap"] 按钮\n脚本错误 = ${window.__errs.length ? window.__errs.join('\n') : '无'}\n面板内容片段：${(root.getElementById('bd').textContent || '').slice(0, 300)}`;
      return;
    }
    btn.click();
    await wait(400);

    const full = document.getElementById('nol-scout-fullmap');
    let layerRect = null, svgRect = null, dots = 0, legend = '';
    if (full) {
      const sh = full.shadowRoot;
      const layer = sh.querySelector('.layer');
      const svg = sh.querySelector('svg.mapsvg');
      if (layer) { const r = layer.getBoundingClientRect(); layerRect = [r.x, r.y, r.width, r.height].map(Math.round); }
      if (svg) { const r = svg.getBoundingClientRect(); svgRect = [Math.round(r.width), Math.round(r.height)]; dots = svg.querySelectorAll('circle').length; }
      legend = (sh.getElementById('fmFoot')?.textContent || '').trim().replace(/\s+/g, ' ');
    }
    diag.textContent = [
      `mode            = ${MODE}`,
      `viewport        = ${innerWidth}×${innerHeight}`,
      `脚本错误         = ${window.__errs.length ? window.__errs.join(' | ') : '无'}`,
      `面板矩形         = ${panelRect.join(', ')}`,
      `面板默认落点     = ${sideOk ? '✓ 贴左（未遮挡中间选座区）' : '✗ 仍在右侧'}`,
      `拖动前 → 拖到屏幕外 = ${beforeDrag.join(', ')}`,
      `夹取后矩形       = ${[dr.x, dr.y, dr.width, dr.height].map(Math.round).join(', ')}`,
      `拖动结果         = ${dragInView ? '✓ 被夹回可见区' : '✗ 跑到视口外'}`,
      `位置记忆         = ${dragMemo}`,
      `贴左/贴右切换     = ${flipOk ? '✓ 翻到另一侧' : '✗ 没动'}（${flipStored ? `left=${flipStored.left}` : '未落盘'}）`,
      `面板地图圆点数   = ${panelDots}`,
      `全屏浮层存在     = ${!!full}`,
      `浮层矩形         = ${layerRect ? layerRect.join(', ') : '—'}`,
      `svg 尺寸         = ${svgRect ? svgRect.join('×') : '—'}`,
      `全屏圆点数       = ${dots}`,
      `图例             = ${legend}`,
      `判定             = ${layerRect && layerRect[2] === innerWidth && layerRect[3] === innerHeight ? '✓ 覆盖整个视口' : '✗ 未覆盖视口'}`,
      `面板日志         = ${panelLogs.join(' ／ ')}`,
    ].join('\n');
  })().catch((e) => { diag.textContent = '✗ 异常：' + e.message + '\n' + e.stack; });

  /** 1:1 复刻 v0.5.1 的 openModal()：验证"点了没反应"的根因。
   *  关键点：style 里定义了 .modal{position:fixed;inset:0;...}，但 markup 里
   *  根本没有任何元素带 class="modal" —— 浮层从未存在过，
   *  .hd 和 #mwrap 只是两个普通块级元素，被追加到 <body> 末尾（页面最底部）。 */
  async function reproduceOldBug() {
    await wait(300);
    const host = document.createElement('div');
    host.id = 'nol-scout-modal';
    const sh = host.attachShadow({ mode: 'open' });
    sh.innerHTML = `<style>
      .modal{position:fixed;inset:0;background:rgba(6,9,14,.93);z-index:2147483600;display:flex;flex-direction:column;padding:18px;gap:10px}
      .hd{display:flex;justify-content:space-between;align-items:center;color:#e8ecf3;font:600 14px -apple-system,sans-serif}
      svg{flex:1;width:100%;background:#080b11;border-radius:10px;border:1px solid #202836}
      .btn{padding:5px 12px;border-radius:7px;border:1px solid #33405a;background:#1b2331;color:#dbe3ee;cursor:pointer;font-size:12px;margin-left:6px}
    </style>
    <div class="hd"><span id="mt">座位全图</span><span>
      <button class="btn" id="mZoom">缩放到命中区块</button>
      <button class="btn" id="mFull">全图</button>
      <button class="btn" id="mClose">关闭</button></span></div>
    <div id="mwrap" style="flex:1;display:flex"></div>`;
    document.body.appendChild(host);
    await wait(200);

    const hdRect = sh.querySelector('.hd').getBoundingClientRect();
    const wrapRect = sh.getElementById('mwrap').getBoundingClientRect();
    const hasModal = !!sh.querySelector('.modal');
    const viewportCover = hdRect.width === innerWidth && hdRect.height === innerHeight;
    diag.textContent = [
      `mode            = old（复刻 v0.5.1）`,
      `viewport        = ${innerWidth}×${innerHeight}`,
      `样式里定义了 .modal = 是`,
      `但 DOM 里 class="modal" 的元素 = ${hasModal ? '有' : '✗ 一个都没有'}`,
      `实际渲染出的 .hd 矩形 = ${[hdRect.x, hdRect.y, hdRect.width, hdRect.height].map(Math.round).join(', ')}`,
      `#mwrap 矩形 = ${[wrapRect.x, wrapRect.y, wrapRect.width, wrapRect.height].map(Math.round).join(', ')}`,
      `判定             = ${viewportCover ? '覆盖视口' : '✗ 没有任何东西盖住视口 —— 这就是"点了没反应"（内容掉到页面最底部，且没有遮罩）'}`,
    ].join('\n');
  }
  </script>
</body>
</html>
